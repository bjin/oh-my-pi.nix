name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-upload-to-cachix:
    name: Build, smoke test, and upload ${{ matrix.package.attr }} to Cachix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - attr: oh-my-pi
            out_link: result-oh-my-pi
          - attr: oh-my-pi-bin
            out_link: result-oh-my-pi-bin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix
        if: vars.CACHIX_CACHE_NAME != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Evaluate flake
        run: nix flake show --no-write-lock-file .

      - name: Build package
        run: 'nix build ".#${{ matrix.package.attr }}" --out-link "${{ matrix.package.out_link }}"'

      - name: Smoke test package
        run: |
          set -euo pipefail
          output=$("./${{ matrix.package.out_link }}/bin/omp" --smoke-test)
          if [ "$output" != 'smoke-test: ok' ]; then
            echo "Unexpected smoke test output: $output" >&2
            exit 1
          fi
          bun_runtime=$(BUN_BE_BUN=1 "./${{ matrix.package.out_link }}/bin/omp" \
            -e 'console.log(`${Bun.version} ${typeof Bun.Image}`)')
          if [ "${bun_runtime##* }" != 'function' ]; then
            echo "Embedded Bun runtime lacks Bun.Image: $bun_runtime" >&2
            exit 1
          fi
          echo "Embedded Bun runtime: $bun_runtime"

      - name: Upload package to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.CACHIX_CACHE_NAME != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "CACHIX_AUTH_TOKEN is not configured; skipping Cachix upload."
            exit 0
          fi

          cachix authtoken "$CACHIX_AUTH_TOKEN"
          readlink -f "${{ matrix.package.out_link }}" | cachix push "$CACHIX_CACHE_NAME"
